<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="container mx-auto max-w-md py-10">
      <div class="form-header">
        <h1 class="font-bold text-2xl">Simple Order Form</h1>
        <p>Please fill out the form below to place your order.</p>
      </div>
      <br />
      <br />
      <form action="" class="w-[500px]">
        <label for="product" class="font-bold">product</label> <br />
        <select id="product" class="border border-gray-300 w-full">
          <option value="" disabled selected>
            Select a product you want to order
          </option>
          <option value="Product 1">Product 1</option>
          <option value="Product 2">Product 2</option>
          <option value="Product 3">Product 3</option>
        </select>
        <div id="product-error" class="text-red-500 hidden text-sm mt-1">
          Product secilmelidir!
        </div>
        <br />
        <br />

        <label for="Quantity"></label>
        <input
          type="number"
          id="quantity"
          placeholder="Quantity"
          class="border w-full border-gray-300"
        />
        <br />
        <br />

        <label for="date"></label>
        <input type="date" id="date" class="border w-full border-gray-300" />
        <div class="delivery-time">
          <label><b>Delivery Time</b></label>
          <div class="grid grid-cols-2 gap-1">
            <label class="flex items-center gap-1">
              <input
                type="radio"
                name="delivery-time"
                value="9:00 AM - 11:00 AM"
              />9:00 AM - 11:00 AM
            </label>

            <label class="flex items-center gap-1">
              <input
                type="radio"
                name="delivery-time"
                value="11:00 AM - 1:00 PM"
              />11:00 AM - 1:00 PM
            </label>

            <label class="flex items-center gap-1">
              <input
                type="radio"
                name="delivery-time"
                value="1:00 PM - 3:00 PM"
              />1:00 PM - 3:00 PM
            </label>

            <label class="flex items-center gap-1">
              <input
                type="radio"
                name="delivery-time"
                value="3:00 PM - 5:00 PM"
              />3:00 PM - 5:00 PM
            </label>
          </div>
        </div>

        <br />
        <br />
        <label for="name"></label>
        <input
          type="text"
          placeholder="name"
          id="name"
          class="border border-gray-300 h-10 w-full"
        />
        <div id="name-error" class="text-red-500 text-sm hidden mt-1">
          Ad daxil edilməlidir!
        </div>
        <br />
        <br />
        <div class="flex gap-2">
          <input
            type="email"
            placeholder="email"
            id="email"
            class="border border-gray-300 h-10 w-full"
          />
          <div id="email-error" class="text-red-500 text-sm hidden mt-1">
            email daxil edilmelidir!
          </div>

          <input
            type="number"
            placeholder="phone"
            id="phone"
            class="border border-gray-300 h-10 w-full"
          />
          <div id="phone-error" class="text-red-500 text-sm hidden mt-1">
            phone daxil edilmelidir!
          </div>
        </div>
        <br /><br />

        <textarea
          id="area"
          placeholder="Additional Comments"
          rows="4"
          class="border p-3 w-full h-[100px] rounded-[7px] border-gray-300"
        ></textarea>
        <br /><br />

        <label>
          <input type="checkbox" id="check" /> I accept the terms and
          conditions.
        </label>
        <br /><br />
        <div id="check-error" class="text-red-500 text-sm hidden mt-1">
          Qaydalarla razilasmalisiniz!
        </div>
        <button
          type="button"
          id="btn"
          class="bg-black text-white font-bold p-3 w-[120px] mx-auto block"
        >
          Place Order
        </button>
      </form>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
