<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./list.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body
    class="bg-gradient-to-r from-[#173495] to-[#0c1c41] p-0 flex justify-center items-center min-h-screen"
  >
    <div
      class="container mx-auto p-0 flex justify-start flex-col bg-[#00052f] w-[600px] h-[600px] rounded-[10px]"
    >
      <div class="text-container bg-[#00042f] w-[400px] h-[170px] flex  items-center justify-between mx-auto mt-10 border rounded-4xl border-blue-600 shadow-[0_0_15px_rgba(59,130,246,0.7)] px-8 shrink-0">
        <div class="text text-white flex flex-col  ">
          <h1 class="text-4xl font-bold ">Todo Done</h1>
          <p class="font-bold m-1">keep it up!</p>
          
        </div>
        <div class="circle bg-[#828eff] rounded-full w-[80px] h-[80px] flex  justify-center items-center  text-white text-3xl font-bold ">1/3
            
        </div>
      </div>

      <div class="inpt-box mx-auto mt-10 flex flex-row gap-3">
        <input
          type="text"
          placeholder="add text..."
          class="border-2 border-indigo-600 w-[310px] h-10 rounded-[10px] bg-white px-2 shrink-0"
        />
        <button
          class="addBtn bg-blue-600 border border-none rounded-full w-[50px] h-10 text-white"
        >
          +
        </button>
      </div>
      <ul
        class="list  overflow-y-auto px-[30px] w-full overflow-x-hidden flex-1 min-h-0"
      ></ul>
    </div>
    <script src="./list.js"></script>
  </body>
</html>
